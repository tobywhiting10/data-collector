# Example base configuration: kiosk settings + your admin (Home) view. Replace with your own.
kiosk_mode:
  non_admin_settings:
    kiosk: true
views:
- title: Home
  visible:
  - user: fe700a880f51466db9f6700abd921dba
  - user: 193947deef1e48dfb7308c04555c967b
  - user: e8bffadbcdfe4319ab2ca94e423ec8a1
  - user: b0c596f884844953b5c139dc37e628b8
  - user: 9c68ea93148d4fbea2ab8aaa2eefb9ff
  - user: 6f48d4800a7a4bad881c1131c584bdd7
  - user: 7b612f44cade4f158955f96ffc991c25
  cards: []
  type: sections
  sections:
  - type: grid
    cards:
    - type: heading
      heading: The fancy ones
      heading_style: title
    - type: entities
      entities:
      - entity: light.christmas_lights
      - entity: switch.christmas_monitors_l1
        name: primary monitor
      - entity: switch.christmas_monitors_l2
        name: secondary monitor
      - entity: button.christmas_alarm_box_reset
        name: Reset Alarm
      - entity: binary_sensor.christmas_alarm_box_alarm_circuit
      - entity: input_boolean.song_enabled
      - entity: light.christmas_lights_button_box_button_light
        name: control box button light
      - entity: light.christmas_lights_button_box_plaque_light
        name: control box plaque light
      - entity: counter.2025_christmas_count
      - entity: input_select.christmas_songs
      - entity: switch.christmas_alarm_box_alarm_enable
    - type: media-control
      entity: media_player.masterfpp
  - type: grid
    cards:
    - type: heading
      heading: Home
      heading_style: title
    - type: entities
      entities:
      - entity: light.christmas_tree
  - type: grid
    cards:
    - type: heading
      heading: Donations
      heading_style: title
    - type: entities
      title: Volunteer info
      entities:
      - entity: input_select.donation_state
      - entity: input_number.donation_total
      - entity: counter.donation_count
      - entity: counter.donation_problem_count
      - entity: input_number.donation_timeout_seconds
      - entity: input_number.donation_min
      - entity: input_number.donation_max
      - entity: input_number.donation_default_amount
      - entity: input_number.donation_return_seconds
      - entity: input_boolean.donation_autostart
        name: Auto-start card payment when Donate by card is pressed
      - type: button
        name: Reset errors
        icon: mdi:restore-alert
        action_name: RESET
        tap_action:
          action: perform-action
          perform_action: script.donation_reset_errors
