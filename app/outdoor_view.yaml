                - width: calc(25vw - 44px)
                - min-width: 0
                - min-height: 100px
                - box-sizing: border-box
                - padding: 8px
                - border-radius: 16px
                - background-color: |
                    [[[
                      const p = states['__PERSON__'];
                      const t = states['timer.help_request_cooldown'];
                      if (t && t.state === 'active') return '#2e7d32';
                      return (p && p.state === 'home') ? '#1565c0' : '#757575';
                    ]]]
                grid:
                - grid-template-areas: '"i" "n"'
                - grid-template-columns: 1fr
                - grid-template-rows: auto auto
                - row-gap: 4px
                name:
                - white-space: normal
                - overflow: visible
                - text-overflow: clip
                - text-align: center
                - line-height: 1.2
                - font-weight: 600
                - font-size: clamp(14px, 1.5vw, 22px)
                - color: white
                icon:
                - width: 40px
                - color: white
