# Outdoor Tab view template used by the admin page's dashboard generator.
# '__SONG_COLUMNS__' is replaced by one column per song category (from songs.yaml); '__PERSON__' by the person entity.
type: panel
title: Outdoor Tab
path: outdoor-tab
cards:
- type: vertical-stack
  cards:
  - type: conditional
    conditions:
    - condition: state
      entity: timer.kiosk_notice
      state: active
    card:
      type: custom:button-card
      icon: mdi:alert-circle-outline
      show_state: false
      triggers_update:
      - input_text.kiosk_notice
      name: |-
        [[[
          const t = states['input_text.kiosk_notice'];
          return t ? t.state : '';
        ]]]
      tap_action:
        action: call-service
        service: timer.cancel
        target:
          entity_id: timer.kiosk_notice
      extra_styles: |
        :host {
          position: fixed;
          top: 20vh;
          left: 50%;
          transform: translateX(-50%);
          width: min(480px, 80vw);
          z-index: 1000;
          display: block;
        }
      styles:
        card:
        - padding: 14px 18px
        - border-radius: 14px
        - background-color: '#b71c1c'
        - box-shadow: 0 6px 24px rgba(0,0,0,0.5)
        grid:
        - grid-template-areas: '"i n"'
        - grid-template-columns: 40px 1fr
        - column-gap: 12px
        name:
        - white-space: normal
        - overflow: visible
        - text-overflow: clip
        - text-align: left
        - font-size: 18px
        - font-weight: '600'
        - color: white
        icon:
        - width: 32px
        - color: white
  - type: conditional
    conditions:
    - condition: state
      entity: input_select.kiosk_page
      state: songs
    - condition: state
      entity: input_boolean.song_enabled
      state: 'on'
    card:
      type: vertical-stack
      cards:
      - type: markdown
        content: |-
          # Welcome To The Bussage Christmas Lights
          Select your favourite song, then press the green **Go!** button ✨

          This show is put together in support of Cancer Research UK.{% if states('sensor.bussage_raised') | is_number %} Through your donations we have managed to raise **£{{ '%.2f' | format(states('sensor.bussage_raised') | float) }}**.{% endif %}
        card_mod:
          style: |
            ha-card {
              margin: 16px 8px 0 8px;
              text-align: center;
            }
      - type: horizontal-stack
        cards:
        - __SONG_COLUMNS__
        - type: custom:mod-card
          card_mod:
            style: |
              :host {
                min-width: 0;
              }
              ha-card {
                /* whitespace on all four sides: 16px top/bottom, 8px sides + 8px padding inside */
                height: calc(100vh - 170px);   /* adjust if the bottom is cut off or a page scrollbar appears */
                margin: 16px 8px;
                padding: 8px;
                box-sizing: border-box;
                overflow-y: auto;
                overflow-x: hidden;
                background: none;
                box-shadow: none;
                border: none;
              }
          card:
            type: vertical-stack
            cards:
            - type: conditional
              conditions:
              - condition: state
                entity: input_select.donation_state
                state: success
              card:
                type: markdown
                content: |
                  # ✅ Thank you!
                  ## Your donation was received
            - type: heading
              heading: Status
              heading_style: title
            - type: tile
              entity: input_select.christmas_songs
              name: 'Curently selected:'
              vertical: false
              tap_action:
                action: none
              icon_tap_action:
                action: none
            - type: custom:button-card
              name: Go!
              icon: mdi:play
              show_state: false
              tap_action:
                action: call-service
                service: automation.trigger
                target:
                  entity_id: automation.christmas_button_trigger
                service_data:
                  skip_condition: true
              hold_action:
                action: call-service
                service: automation.trigger
                target:
                  entity_id: automation.christmas_button_trigger
                service_data:
                  skip_condition: true
              extra_styles: |
                :host {
                  display: block;
                  width: 100%;
                  min-width: 0;
                }
              styles:
                card:
                - width: calc(25vw - 44px)
                - min-width: 0
                - min-height: 100px
                - box-sizing: border-box
                - padding: 8px
                - border-radius: 16px
                - background-color: '#2e7d32'
                grid:
                - grid-template-areas: '"i" "n"'
                - grid-template-columns: 1fr
                - grid-template-rows: auto auto
                - row-gap: 4px
                name:
                - white-space: normal
                - overflow: visible
                - text-overflow: clip
                - text-align: center
                - line-height: 1.2
                - font-weight: 600
                - font-size: clamp(14px, 1.5vw, 22px)
                - color: white
                icon:
                - width: 40px
                - color: white
            - type: custom:button-card
              name: Stop
              icon: mdi:stop-circle
              show_state: false
              tap_action:
                action: call-service
                service: input_select.select_option
                service_data:
                  entity_id: input_select.christmas_songs
                  option: Stop
              hold_action:
                action: call-service
                service: input_select.select_option
                service_data:
                  entity_id: input_select.christmas_songs
                  option: Stop
              extra_styles: |
                :host {
                  display: block;
                  width: 100%;
                  min-width: 0;
                }
              styles:
                card:
                - width: calc(25vw - 44px)
                - min-width: 0
                - min-height: 100px
                - box-sizing: border-box
                - padding: 8px
                - border-radius: 16px
                - background-color: '#c62828'
                grid:
                - grid-template-areas: '"i" "n"'
                - grid-template-columns: 1fr
                - grid-template-rows: auto auto
                - row-gap: 4px
                name:
                - white-space: normal
                - overflow: visible
                - text-overflow: clip
                - text-align: center
                - line-height: 1.2
                - font-weight: 600
                - font-size: clamp(14px, 1.5vw, 22px)
                - color: white
                icon:
                - width: 40px
                - color: white
            - type: custom:button-card
              name: Donate by card
              icon: mdi:credit-card-tap
              show_state: false
              tap_action:
                action: call-service
                service: script.donation_open
              extra_styles: |
                :host {
                  display: block;
                  width: 100%;
                  min-width: 0;
                }
              styles:
                card:
                - width: calc(25vw - 44px)
                - min-width: 0
                - min-height: 100px
                - box-sizing: border-box
                - padding: 8px
                - border-radius: 16px
                - background-color: '#f9a825'
                grid:
                - grid-template-areas: '"i" "n"'
                - grid-template-columns: 1fr
                - grid-template-rows: auto auto
                - row-gap: 4px
                name:
                - white-space: normal
