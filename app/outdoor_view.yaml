                - text-overflow: clip
                - text-align: center
                - line-height: 1.2
                - font-weight: 600
                - font-size: clamp(14px, 1.5vw, 22px)
                - color: black
                icon:
                - width: 40px
                - color: black
            - type: custom:button-card
              icon: mdi:hand-wave
              show_state: false
              triggers_update:
              - __PERSON__
              - timer.help_request_cooldown
              name: |
                [[[
                  const p = states['__PERSON__'];
                  const t = states['timer.help_request_cooldown'];
                  if (t && t.state === 'active') return 'Help requested - someone is on the way';
                  return (p && p.state === 'home') ? 'Request help' : 'Help not available';
                ]]]
              tap_action:
                action: call-service
                service: script.donation_help_dashboard
              extra_styles: |
                :host {
                  display: block;
                  width: 100%;
                  min-width: 0;
                }
              styles:
