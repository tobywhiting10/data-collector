# Portainer: Stacks > Add stack > "Repository" (git) if this folder is in a repo, so Portainer can
# build the image; or build/push the image yourself (see README) and replace `build: .` with `image:`.
# Set the variables in the stack's "Environment variables" section (or paste a .env file).
services:
  bussage-stats:
    build: .
    image: bussage-stats:latest
    container_name: bussage-stats
    restart: unless-stopped
    environment:
      API_KEY: ${API_KEY:?set API_KEY (>=16 chars)}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://stats.tobywhiting10.com}
      CHARITY_SHARE: ${CHARITY_SHARE:-0.90}
      FEE_PERCENT: ${FEE_PERCENT:-1.69}
      FEE_FIXED_PENCE: ${FEE_FIXED_PENCE:-0}
      COLLECT_INTERVAL_MIN: ${COLLECT_INTERVAL_MIN:-60}
      CRUK_URL: ${CRUK_URL:-https://fundraise.cancerresearchuk.org/page/bussage-christmas-lights-show}
      TZ: Europe/London
    volumes:
      - /etc/server_data/bussage-data:/data            # SQLite database: include this volume in your backups
    ports:
      - "8800:8000"                   # or remove and attach to your reverse proxy's network instead
    networks:
      - proxy

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.http.routers.data-collector.rule=Host(`stats.tobywhiting10.com`)"
      - "traefik.http.routers.data-collector.entrypoints=https"
      - "traefik.http.routers.data-collector.tls=true"
      - "traefik.http.routers.data-collector.tls.certresolver=stepca"

      - "traefik.http.services.data-collector.loadbalancer.server.port=8000"

networks:
  proxy:
    external: true
